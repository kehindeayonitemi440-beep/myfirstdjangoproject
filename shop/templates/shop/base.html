{% load static %}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{% block title %}{{ site.brand_name }} | Ankara and fine fabrics{% endblock %}</title>
    <meta name="description" content="{{ site.hero_text }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'shop/css/style.css' %}" />
  </head>
  <body>
    <a class="skip-link" href="#top">Skip to content</a>
    {% include "shop/partials/_nav.html" %}

    <main id="top">
      {% block content %}{% endblock %}
    </main>

    <footer class="site">
      <div class="wrap">
        &copy; {% now "Y" %} {{ site.brand_name }}. All rights reserved.
      </div>
    </footer>

    <script src="{% static 'shop/js/main.js' %}" defer></script>
  </body>
</html>
