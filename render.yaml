services:
  - type: web
    name: ankara-store
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    disk:
      name: ankara-store-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ankara-store-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /var/data/media

databases:
  - name: ankara-store-db
    plan: basic-256mb
    databaseName: ankara_store
    user: ankara_store
