# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
databases:
  - name: ankara-db
    plan: basic-256mb
    databaseName: ankara_store
    user: ankara_store

services:
  - type: web
    name: ankara-store
    runtime: python
    plan: starter            # persistent disks need a paid plan
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60 --access-logfile -
    healthCheckPath: /
    disk:
      name: media
      mountPath: /var/data   # uploaded fabric photos survive redeploys here
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ankara-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /var/data/media
      # Admin login, created on first deploy. Render prompts for these two.
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # First deploy loads sample fabrics. Set to 0 afterwards.
      - key: SEED_SAMPLE_DATA
        value: "1"
